name: Sync scripts to Linode Object Storage

on:
  push:
    branches: [main]
    paths:
      - run-fio.sh
      - .github/workflows/sync-linode-objects.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run on the canonical repo; forks can enable by adjusting this.
    if: ${{ github.repository == 'edwardtoday/fio-tests' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${LINODE_OBJECT_STORAGE_ACCESS_KEY:-}" ] || [ -z "${LINODE_OBJECT_STORAGE_SECRET_KEY:-}" ]; then
            echo "Missing secrets: LINODE_OBJECT_STORAGE_ACCESS_KEY / LINODE_OBJECT_STORAGE_SECRET_KEY"
            exit 1
          fi
        env:
          LINODE_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          LINODE_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}

      - name: Ensure awscli
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          sudo apt-get update -y
          sudo apt-get install -y awscli
          aws --version

      - name: Upload run-fio.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          endpoint='https://us-east-1.linodeobjects.com'
          bucket='sansi-share'
          key='2025/run-fio.sh'

          echo "endpoint=${endpoint}"
          echo "bucket=${bucket}"
          echo "key=${key}"
          echo "access_key_id_prefix=${AWS_ACCESS_KEY_ID:0:6}"
          aws configure list
          # Linode Object Storage public URLs are commonly path-style; force awscli to use path-style too.
          aws configure set default.s3.addressing_style path

          echo "checking bucket access..."
          aws s3api head-bucket --bucket "${bucket}" --endpoint-url "${endpoint}"
          echo "listing bucket prefix..."
          aws s3 ls "s3://${bucket}/2025/" --endpoint-url "${endpoint}" || true

          echo "uploading..."
          aws s3 cp ./run-fio.sh "s3://${bucket}/${key}" \
            --endpoint-url "${endpoint}" \
            --content-type text/x-shellscript \
            --cache-control "max-age=60"
          echo "done"
