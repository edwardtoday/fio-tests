name: Sync scripts to Linode Object Storage

on:
  push:
    branches: [main]
    paths:
      - run-fio.sh
      - .github/workflows/sync-linode-objects.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only run on the canonical repo; forks can enable by adjusting this.
    if: ${{ github.repository == 'edwardtoday/fio-tests' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${LINODE_OBJECT_STORAGE_ACCESS_KEY:-}" ] || [ -z "${LINODE_OBJECT_STORAGE_SECRET_KEY:-}" ]; then
            echo "Missing secrets: LINODE_OBJECT_STORAGE_ACCESS_KEY / LINODE_OBJECT_STORAGE_SECRET_KEY"
            exit 1
          fi
          case "${LINODE_OBJECT_STORAGE_ACCESS_KEY}" in
            *$'\n'*|*$'\r'*|*' '*|*$'\t'*)
              echo "LINODE_OBJECT_STORAGE_ACCESS_KEY contains whitespace/newline; re-add secret without extra spaces/newlines."
              exit 1
              ;;
          esac
          case "${LINODE_OBJECT_STORAGE_SECRET_KEY}" in
            *$'\n'*|*$'\r'*)
              echo "LINODE_OBJECT_STORAGE_SECRET_KEY contains newline; re-add secret without extra newlines."
              exit 1
              ;;
          esac
        env:
          LINODE_OBJECT_STORAGE_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          LINODE_OBJECT_STORAGE_SECRET_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}

      - name: Ensure awscli
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi
          sudo apt-get update -y
          sudo apt-get install -y awscli
          aws --version

      - name: Upload run-fio.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LINODE_OBJECT_STORAGE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LINODE_OBJECT_STORAGE_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          endpoint='https://us-east-1.linodeobjects.com'
          bucket='sansi-share'
          key='2025/run-fio.sh'

          echo "endpoint=${endpoint}"
          echo "bucket=${bucket}"
          echo "key=${key}"
          echo "access_key_id_prefix=${AWS_ACCESS_KEY_ID:0:6}"

          # Note: Linode Object Storage (RGW) may reject AWS CLI's chunked/streaming uploads with HTTP 411.
          # Use s3cmd which sends Content-Length.
          sudo apt-get update -y
          sudo apt-get install -y s3cmd

          {
            echo '[default]'
            echo "access_key = ${AWS_ACCESS_KEY_ID}"
            echo "secret_key = ${AWS_SECRET_ACCESS_KEY}"
            echo 'host_base = us-east-1.linodeobjects.com'
            echo 'host_bucket = us-east-1.linodeobjects.com'
            echo 'bucket_location = us-east-1'
            echo 'use_https = True'
            echo 'signature_v2 = False'
          } > /tmp/s3cmd.cfg

          echo "checking bucket access..."
          s3cmd --config /tmp/s3cmd.cfg ls "s3://${bucket}/" >/dev/null
          echo "listing bucket prefix..."
          s3cmd --config /tmp/s3cmd.cfg ls "s3://${bucket}/2025/" || true

          echo "uploading..."
          s3cmd --config /tmp/s3cmd.cfg put \
            --mime-type text/x-shellscript \
            --add-header "Cache-Control:max-age=60" \
            ./run-fio.sh "s3://${bucket}/${key}"
          echo "done"
