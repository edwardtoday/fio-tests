<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fio 测试汇总</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 24px; color: #1f2933; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #52606d; margin-bottom: 24px; }
    table { border-collapse: collapse; width: 100%; margin: 24px 0; font-size: 14px; }
    th, td { border: 1px solid #d9e2ec; padding: 8px 10px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #f0f4f8; cursor: pointer; user-select: none; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    canvas { background: #fff; border: 1px solid #e4e7eb; padding: 12px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  </style>
</head>
<body>
  <h1>fio 测试汇总</h1>
  <div class="subtitle">随机读写展示 IOPS 与 MiB/s，顺序读写展示吞吐 (MiB/s)。数据来自仓库中的 fio 测试日志。</div>

  <div id="runsControls" style="display:none; margin: 16px 0; padding: 12px; border: 1px solid #e4e7eb; border-radius: 8px; background: #fff;">
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
      <label style="display:flex; gap:6px; align-items:center;">
        <input type="checkbox" id="latestOnly" checked />
        only show latest result for the same target
      </label>

      <label>op
        <select id="opSelect">
          <option value="read" selected>read</option>
          <option value="write">write</option>
          <option value="auto">auto</option>
        </select>
      </label>

      <label>view
        <select id="viewSelect">
          <option value="by_system" selected>by system</option>
          <option value="history">history (time)</option>
          <option value="compare">compare</option>
        </select>
      </label>

      <label>metric
        <select id="metricSelect">
          <option value="bw_mib_s" selected>bw_mib_s</option>
          <option value="iops">iops</option>
          <option value="clat_p95_ms">clat_p95_ms</option>
          <option value="clat_p99_ms">clat_p99_ms</option>
        </select>
      </label>

      <label>system <select id="systemSelect"></select></label>

      <label>rw <select id="rwSelect"></select></label>
      <label>bs <select id="bsSelect"></select></label>
      <label>qd <select id="qdSelect"></select></label>
      <label>runtime_s <select id="runtimeSelect"></select></label>
      <label>direct <select id="directSelect"></select></label>
      <label>fdatasync <select id="fdatasyncSelect"></select></label>
      <label>ioengine <select id="ioengineSelect"></select></label>
      <label>rwmixread <select id="mixSelect"></select></label>
      <label>size_policy <select id="sizePolicySelect"></select></label>

      <label>case
        <select id="caseSelect" style="min-width: 340px;"></select>
      </label>
    </div>
    <div id="compareControls" style="display:none; margin-top: 12px; border-top: 1px dashed #e4e7eb; padding-top: 12px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:flex-start;">
        <label>group by
          <select id="compareGroupBy">
            <option value="metric" selected>metric</option>
            <option value="run">run (system)</option>
          </select>
        </label>

        <label>systems (multi)
          <select id="compareSystems" multiple size="6" style="min-width: 260px;"></select>
        </label>

        <label>cases (multi)
          <select id="compareCases" multiple size="6" style="min-width: 520px;"></select>
        </label>

        <label>metrics (multi)
          <select id="compareMetrics" multiple size="6" style="min-width: 200px;">
            <option value="iops">iops</option>
            <option value="bw_mib_s" selected>bw_mib_s</option>
            <option value="clat_p95_ms">clat_p95_ms</option>
            <option value="clat_p99_ms">clat_p99_ms</option>
          </select>
        </label>
      </div>
      <div style="margin-top: 10px; color:#52606d; font-size: 13px;">
        compare 默认按 “每个 system × 每个 case/op” 各自选择最新包含该 case 的 run（避免最新一次没跑该 case 导致空值）。
      </div>
    </div>
    <div id="runsHint" style="margin-top: 10px; color:#52606d; font-size: 13px;"></div>
  </div>

  <table id="results">
    <thead>
      <tr>
        <th data-key="device">设备</th>
        <th data-key="rand_read_iops">随机读 IOPS</th>
        <th data-key="rand_read_bw_mib">随机读 MiB/s</th>
        <th data-key="rand_write_iops">随机写 IOPS</th>
        <th data-key="rand_write_bw_mib">随机写 MiB/s</th>
        <th data-key="seq_read_mib_s">顺序读 MiB/s</th>
        <th data-key="seq_write_mib_s">顺序写 MiB/s</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="runDetails" style="display:none; margin: 16px 0; padding: 12px; border: 1px solid #e4e7eb; border-radius: 8px; background: #fff;">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 8px;">
      <div id="runDetailsTitle" style="font-weight: 600;"></div>
      <button id="runDetailsClose" type="button">close</button>
    </div>
    <div id="runDetailsMeta" style="color:#52606d; font-size: 13px; margin-bottom: 10px;"></div>
    <table id="runDetailsTable" style="margin: 0;">
      <thead>
        <tr>
          <th data-key="case">case</th>
          <th data-key="op">op</th>
          <th data-key="iops">iops</th>
          <th data-key="bw_mib_s">bw_mib_s</th>
          <th data-key="clat_p95_ms">clat_p95_ms</th>
          <th data-key="clat_p99_ms">clat_p99_ms</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="charts">
    <canvas id="bwAll"></canvas>
  </div>

<script>
let data = [];

async function loadData() {
  const res = await fetch('results/data.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(`failed to load results/data.json: ${res.status}`);
  const doc = await res.json();
  return doc;
}

Chart.register(ChartDataLabels);

function fmt(val, digits=1) {
  return (val === null || val === undefined) ? '-' : Number(val).toFixed(digits);
}

function fmtLatencyMs(ms) {
  if (ms === null || ms === undefined) return '-';
  const v = Number(ms);
  if (!Number.isFinite(v)) return '-';
  if (v < 1) return `${Math.round(v * 1000)}µs`;
  return `${v.toFixed(2)}ms`;
}

const runsControls = document.getElementById('runsControls');
const runsHint = document.getElementById('runsHint');
const tbody = document.querySelector('#results tbody');
const theadRow = document.querySelector('#results thead tr');

const runDetails = document.getElementById('runDetails');
const runDetailsTitle = document.getElementById('runDetailsTitle');
const runDetailsMeta = document.getElementById('runDetailsMeta');
const runDetailsTbody = document.querySelector('#runDetailsTable tbody');
document.getElementById('runDetailsClose').addEventListener('click', () => {
  runDetails.style.display = 'none';
});

let viewMode = 'legacy'; // legacy|runs
let sortKey = 'seq_read_mib_s';
let sortDir = 'asc';
let headerCells = [];
let currentHeaderMode = ''; // legacy|runs|compare

function setHeaders(headers) {
  theadRow.innerHTML = headers.map(h => `<th data-key="${h.key}">${h.label}</th>`).join('');
  headerCells = Array.from(document.querySelectorAll('#results thead th[data-key]'));
  currentHeaderMode = (viewMode === 'runs') ? 'runs' : 'legacy';
}

function clearHeadersAndSort() {
  theadRow.innerHTML = '';
  headerCells = [];
  currentHeaderMode = 'compare';
}

function ensureRunsHeaders() {
  if (currentHeaderMode === 'runs' && headerCells.length) return;
  setHeaders([
    { key: 'system', label: 'system' },
    { key: 'timestamp', label: 'timestamp' },
    { key: 'op', label: 'op' },
    { key: 'iops', label: 'iops' },
    { key: 'bw_mib_s', label: 'bw_mib_s' },
    { key: 'clat_p95_ms', label: 'clat_p95_ms' },
    { key: 'clat_p99_ms', label: 'clat_p99_ms' }
  ]);
  bindSortHandlers();
}

function ensureLegacyHeaders() {
  if (currentHeaderMode === 'legacy' && headerCells.length) return;
  setHeaders([
    { key: 'device', label: '设备' },
    { key: 'rand_read_iops', label: '随机读 IOPS' },
    { key: 'rand_read_bw_mib', label: '随机读 MiB/s' },
    { key: 'rand_write_iops', label: '随机写 IOPS' },
    { key: 'rand_write_bw_mib', label: '随机写 MiB/s' },
    { key: 'seq_read_mib_s', label: '顺序读 MiB/s' },
    { key: 'seq_write_mib_s', label: '顺序写 MiB/s' }
  ]);
  bindSortHandlers();
}

function bindSortHandlers() {
  headerCells.forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = key;
        sortDir = (key === 'device' || key === 'system' || key === 'timestamp') ? 'asc' : 'desc';
      }
      renderAll();
    });
  });
}

function sortData(rows) {
  return [...rows].sort((a, b) => {
    const va = a[sortKey];
    const vb = b[sortKey];
    const na = va === null || va === undefined;
    const nb = vb === null || vb === undefined;
    if (na && nb) return 0;
    if (na) return 1;
    if (nb) return -1;
    const bothNumbers = typeof va === 'number' && typeof vb === 'number';
    if (bothNumbers) return sortDir === 'asc' ? va - vb : vb - va;
    const cmp = String(va).localeCompare(String(vb), 'zh-Hans');
    return sortDir === 'asc' ? cmp : -cmp;
  });
}

function renderTable(sorted) {
  tbody.innerHTML = '';
  sorted.forEach(d => {
    const tr = document.createElement('tr');
    if (viewMode === 'legacy') {
      tr.innerHTML = `
        <td>${d.device}</td>
        <td>${fmt(d.rand_read_iops,0)}</td>
        <td>${fmt(d.rand_read_bw_mib,2)}</td>
        <td>${fmt(d.rand_write_iops,0)}</td>
        <td>${fmt(d.rand_write_bw_mib,2)}</td>
        <td>${fmt(d.seq_read_mib_s,1)}</td>
        <td>${fmt(d.seq_write_mib_s,1)}</td>`;
    } else {
      tr.innerHTML = `
        <td><a href="#" data-runid="${d.run_id}">${d.system}</a></td>
        <td><a href="results/runs/${d.run_id}.json" target="_blank" rel="noopener">${d.timestamp}</a></td>
        <td>${d.op || ''}</td>
        <td>${fmt(d.iops,0)}</td>
        <td>${fmt(d.bw_mib_s,2)}</td>
        <td>${fmtLatencyMs(d.clat_p95_ms)}</td>
        <td>${fmtLatencyMs(d.clat_p99_ms)}</td>`;
    }
    tbody.appendChild(tr);
  });
}

function getSelectedValues(select) {
  return Array.from(select.selectedOptions).map(o => o.value).filter(v => v !== '');
}

function setMultiSelectOptions(select, values, selectedValues=[]) {
  const selected = new Set(selectedValues);
  select.innerHTML = '';
  values.forEach(v => {
    const o = document.createElement('option');
    o.value = String(v);
    o.textContent = String(v);
    o.selected = selected.has(String(v));
    select.appendChild(o);
  });
}

function updateHeaderIndicators() {
  headerCells.forEach(th => {
    const base = th.dataset.label || th.textContent.replace(/ [↑↓]$/, '');
    th.dataset.label = base;
    if (th.dataset.key === sortKey) {
      th.textContent = `${base} ${sortDir === 'asc' ? '↑' : '↓'}`;
    } else {
      th.textContent = base;
    }
  });
}

const bwCanvas = document.getElementById('bwAll');
let bwChart = null;
let BW_DATASET_COUNT = 4;
const BW_BAR_THICKNESS = 12; // 提高每组柱子的厚度，避免 data label 纵向挤在一起

function ensureChart(chartType, datasetCount, datasetLabels) {
  const needRecreate = !bwChart || bwChart.config.type !== chartType || BW_DATASET_COUNT !== datasetCount;
  if (!needRecreate) return;

  if (bwChart) bwChart.destroy();
  BW_DATASET_COUNT = datasetCount;

  const colors = ['#7c3aed', '#f97316', '#0ea5e9', '#e11d48', '#10b981', '#f59e0b'];
  const datasets = datasetLabels.map((label, idx) => ({
    label,
    backgroundColor: colors[idx % colors.length],
    borderColor: colors[idx % colors.length],
    data: [],
    barThickness: BW_BAR_THICKNESS,
    maxBarThickness: BW_BAR_THICKNESS
  }));

  bwChart = new Chart(bwCanvas.getContext('2d'), {
    type: chartType,
    data: { labels: [], datasets },
    options: {
      indexAxis: chartType === 'bar' ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom' },
        datalabels: {
          color: '#111827',
          anchor: 'end',
          align: 'end',
          offset: 4,
          clip: false,
          font: { size: 10 },
          formatter: (v) => (v == null ? '' : Number(v).toFixed(2))
        }
      },
      scales: {
        x: { beginAtZero: true },
        y: { ticks: { autoSkip: false, maxRotation: 0, minRotation: 0 } }
      }
    }
  });
}

function renderChart(sorted) {
  if (viewMode === 'legacy') {
    // legacy: 设备为行（bar 横向）
    const datasetCount = 4;
    const perDevice = BW_BAR_THICKNESS * datasetCount + 28;
    const height = 200 + sorted.length * perDevice;
    bwCanvas.style.height = `${height}px`;

    ensureChart('bar', datasetCount, ['随机读 MiB/s', '随机写 MiB/s', '顺序读 MiB/s', '顺序写 MiB/s']);
    bwChart.data.labels = sorted.map(d => d.device);
    bwChart.data.datasets[0].data = sorted.map(d => d.rand_read_bw_mib);
    bwChart.data.datasets[1].data = sorted.map(d => d.rand_write_bw_mib);
    bwChart.data.datasets[2].data = sorted.map(d => d.seq_read_mib_s);
    bwChart.data.datasets[3].data = sorted.map(d => d.seq_write_mib_s);
  } else {
    const metric = document.getElementById('metricSelect').value;
    const view = document.getElementById('viewSelect').value;
    const opMode = document.getElementById('opSelect')?.value || 'read';
    if (view === 'history') {
      const historyRows = (opMode === 'auto') ? sorted.filter(r => r.op === 'read') : sorted;
      // history: 同一 system 多次 run 按时间串起来（line）
      const height = 260 + Math.min(30, historyRows.length) * 10;
      bwCanvas.style.height = `${height}px`;

      const bySystem = new Map();
      historyRows.forEach(r => {
        if (!bySystem.has(r.system)) bySystem.set(r.system, []);
        bySystem.get(r.system).push(r);
      });
      const systems = Array.from(bySystem.keys()).sort((a,b) => a.localeCompare(b, 'zh-Hans'));
      const labels = Array.from(new Set(historyRows.map(r => r.timestamp))).sort();

      ensureChart('line', systems.length, systems.map(s => s));
      bwChart.data.labels = labels;
      bwChart.data.datasets.forEach((ds, idx) => {
        const sys = systems[idx];
        const list = bySystem.get(sys) || [];
        const map = new Map(list.map(r => [r.timestamp, r]));
        ds.data = labels.map(t => {
          const row = map.get(t);
          return row ? row[metric] : null;
        });
        ds.tension = 0.2;
        ds.pointRadius = 2;
        ds.borderWidth = 2;
        ds.fill = false;
      });
      // line 图禁用 data labels，避免过密
      bwChart.options.plugins.datalabels.display = false;
      bwChart.options.scales.x = { ticks: { maxRotation: 0, minRotation: 0, autoSkip: true, maxTicksLimit: 12 } };
      bwChart.options.scales.y = { beginAtZero: false };
    } else {
      // by_system: 默认以 system 为行（bar 横向）
      const datasetCount = (opMode === 'auto') ? 2 : 1;
      const rowCount = (opMode === 'auto') ? uniqInOrder(sorted.map(d => d.system)).length : sorted.length;
      const perDevice = BW_BAR_THICKNESS * datasetCount + 28;
      const height = 200 + rowCount * perDevice;
      bwCanvas.style.height = `${height}px`;

      if (opMode === 'auto') {
        const systems = uniqInOrder(sorted.map(d => d.system));
        ensureChart('bar', datasetCount, [`read ${metric}`, `write ${metric}`]);
        bwChart.data.labels = systems;
        const readMap = new Map(sorted.filter(r => r.op === 'read').map(r => [r.system, r[metric]]));
        const writeMap = new Map(sorted.filter(r => r.op === 'write').map(r => [r.system, r[metric]]));
        bwChart.data.datasets[0].data = systems.map(s => readMap.get(s) ?? null);
        bwChart.data.datasets[1].data = systems.map(s => writeMap.get(s) ?? null);
      } else {
        const label = `metric: ${metric}`;
        ensureChart('bar', datasetCount, [label]);
        bwChart.data.labels = sorted.map(d => d.system);
        bwChart.data.datasets[0].data = sorted.map(d => d[metric]);
      }
      bwChart.options.plugins.datalabels.display = true;
      bwChart.options.scales.x = { beginAtZero: true };
      bwChart.options.scales.y = { ticks: { autoSkip: false, maxRotation: 0, minRotation: 0 } };
    }
  }
  bwChart.update();
}

function uniqSorted(values) {
  return Array.from(new Set(values.filter(v => v !== null && v !== undefined && v !== ''))).sort((a,b) => String(a).localeCompare(String(b)));
}

function uniqInOrder(values) {
  const out = [];
  const seen = new Set();
  values.forEach(v => {
    if (v === null || v === undefined || v === '') return;
    const key = String(v);
    if (seen.has(key)) return;
    seen.add(key);
    out.push(v);
  });
  return out;
}

function setSelectOptions(select, values, allLabel='(any)') {
  const current = select.value;
  select.innerHTML = '';
  const optAny = document.createElement('option');
  optAny.value = '';
  optAny.textContent = allLabel;
  select.appendChild(optAny);
  values.forEach(v => {
    const o = document.createElement('option');
    o.value = String(v);
    o.textContent = String(v);
    select.appendChild(o);
  });
  if ([...select.options].some(o => o.value === current)) {
    select.value = current;
  }
}

function caseLabel(sig) {
  const rw = sig.rw;
  const bs = sig.bs;
  const qd = sig.qd;
  const runtime = sig.runtime_s == null ? '-' : sig.runtime_s;
  const mix = sig.rwmixread == null ? '' : ` mix${sig.rwmixread}`;
  const direct = sig.direct ? 'direct' : 'buffered';
  const fd = sig.fdatasync ? '+fdatasync' : '';
  const sp = sig.size_policy?.mode || 'size';
  return `${rw} ${bs} qd${qd} rt${runtime}s ${direct} ${sig.ioengine}${fd}${mix} ${sp}`;
}

function matchesFilter(sig, key, val) {
  if (!val) return true;
  const actual = sig[key];
  if (actual == null) return false;
  return String(actual) === String(val);
}

function buildRunsView(doc) {
  const caseDefs = doc.case_defs || {};
  const measurements = doc.measurements || [];

  function stableStringify(value) {
    if (value === null || value === undefined) return 'null';
    if (typeof value !== 'object') return JSON.stringify(value);
    if (Array.isArray(value)) return `[${value.map(stableStringify).join(',')}]`;
    const keys = Object.keys(value).sort();
    return `{${keys.map(k => `${JSON.stringify(k)}:${stableStringify(value[k])}`).join(',')}}`;
  }

  const caseOps = new Map();
  measurements.forEach(m => {
    if (!m.case_key || !m.op) return;
    let s = caseOps.get(m.case_key);
    if (!s) {
      s = new Set();
      caseOps.set(m.case_key, s);
    }
    s.add(m.op);
  });

  const swapGroups = new Map();
  const swapRwFamily = (rw) => {
    if (rw === 'randread' || rw === 'randwrite') return 'randr';
    if (rw === 'read' || rw === 'write') return 'seq';
    return rw;
  };
  Object.entries(caseDefs).forEach(([ck, sig]) => {
    const family = swapRwFamily(sig.rw);
    const gsig = { ...sig, rw: family };
    const gid = stableStringify(gsig);
    let g = swapGroups.get(gid);
    if (!g) {
      g = {};
      swapGroups.set(gid, g);
    }
    g[sig.rw] = ck;
  });

  const rwSelect = document.getElementById('rwSelect');
  const bsSelect = document.getElementById('bsSelect');
  const qdSelect = document.getElementById('qdSelect');
  const runtimeSelect = document.getElementById('runtimeSelect');
  const directSelect = document.getElementById('directSelect');
  const fdatasyncSelect = document.getElementById('fdatasyncSelect');
  const ioengineSelect = document.getElementById('ioengineSelect');
  const mixSelect = document.getElementById('mixSelect');
  const sizePolicySelect = document.getElementById('sizePolicySelect');
  const caseSelect = document.getElementById('caseSelect');
  const opSelect = document.getElementById('opSelect');
  const viewSelect = document.getElementById('viewSelect');
  const systemSelect = document.getElementById('systemSelect');
  const compareControls = document.getElementById('compareControls');
  const compareGroupBy = document.getElementById('compareGroupBy');
  const compareSystems = document.getElementById('compareSystems');
  const compareCases = document.getElementById('compareCases');
  const compareMetrics = document.getElementById('compareMetrics');

  const sigs = Object.values(caseDefs);
  setSelectOptions(rwSelect, uniqSorted(sigs.map(s => s.rw)));
  setSelectOptions(bsSelect, uniqSorted(sigs.map(s => s.bs)));
  setSelectOptions(qdSelect, uniqSorted(sigs.map(s => s.qd)));
  setSelectOptions(runtimeSelect, uniqSorted(sigs.map(s => s.runtime_s)));
  setSelectOptions(directSelect, uniqSorted(sigs.map(s => s.direct)));
  setSelectOptions(fdatasyncSelect, uniqSorted(sigs.map(s => s.fdatasync)));
  setSelectOptions(ioengineSelect, uniqSorted(sigs.map(s => s.ioengine)));
  setSelectOptions(mixSelect, uniqSorted(sigs.map(s => s.rwmixread)));
  setSelectOptions(sizePolicySelect, uniqSorted(sigs.map(s => s.size_policy?.mode)));
  setSelectOptions(systemSelect, uniqSorted(measurements.map(m => m.system)), '(all)');

  function rebuildCompareOptions() {
    // systems: default select all
    const allSystems = uniqSorted(measurements.map(m => m.system));
    const selectedSystems = getSelectedValues(compareSystems);
    setMultiSelectOptions(compareSystems, allSystems, selectedSystems.length ? selectedSystems : allSystems);

    // cases: based on current signature filters + current op selection
    const rw = rwSelect.value;
    const bs = bsSelect.value;
    const qd = qdSelect.value;
    const rt = runtimeSelect.value;
    const direct = directSelect.value;
    const fd = fdatasyncSelect.value;
    const engine = ioengineSelect.value;
    const mix = mixSelect.value;
    const sp = sizePolicySelect.value;
    const selectedOp = opSelect.value;

    const entries = Object.entries(caseDefs)
      .filter(([caseKey, sig]) =>
        matchesFilter(sig, 'rw', rw) &&
        matchesFilter(sig, 'bs', bs) &&
        matchesFilter(sig, 'qd', qd) &&
        matchesFilter(sig, 'runtime_s', rt) &&
        matchesFilter(sig, 'direct', direct) &&
        matchesFilter(sig, 'fdatasync', fd) &&
        matchesFilter(sig, 'ioengine', engine) &&
        matchesFilter(sig, 'rwmixread', mix) &&
        (sp ? String(sig.size_policy?.mode || '') === String(sp) : true) &&
        // op=read/write 时，至少存在对应 op；op=auto 时只要有任意 op 即可
        (selectedOp ? (caseOps.get(caseKey)?.has(selectedOp) || selectedOp === 'auto') : true)
      )
      .map(([ck, sig]) => ({ ck, label: caseLabel(sig) }))
      .sort((a,b) => a.label.localeCompare(b.label));

    const selectedCases = getSelectedValues(compareCases);
    compareCases.innerHTML = '';
    entries.forEach(e => {
      const o = document.createElement('option');
      o.value = e.ck;
      o.textContent = e.label;
      o.selected = selectedCases.length ? selectedCases.includes(e.ck) : false;
      compareCases.appendChild(o);
    });
    // Default select current case if nothing selected
    if (!selectedCases.length && caseSelect.value && compareCases.querySelector(`option[value="${caseSelect.value}"]`)) {
      compareCases.querySelector(`option[value="${caseSelect.value}"]`).selected = true;
    }

    // metrics: keep current selection or default bw_mib_s
    if (!Array.from(compareMetrics.selectedOptions).length) {
      Array.from(compareMetrics.options).forEach(o => { o.selected = (o.value === 'bw_mib_s'); });
    }
  }

  function swapCaseKeyForOp(caseKey, wantOp) {
    const sig = caseDefs[caseKey];
    if (!sig) return '';
    const family = swapRwFamily(sig.rw);
    const gid = stableStringify({ ...sig, rw: family });
    const group = swapGroups.get(gid) || {};
    if (wantOp === 'read') return group.randread || group.read || '';
    if (wantOp === 'write') return group.randwrite || group.write || '';
    return '';
  }

  function normalizeSelection() {
    const currentCaseKey = caseSelect.value;
    if (!currentCaseKey) return;

    const sig = caseDefs[currentCaseKey];
    if (!sig) return;

    const availableOps = Array.from(caseOps.get(currentCaseKey) || []);
    if (opSelect.value === 'auto') return;
    if (availableOps.length === 1) {
      opSelect.value = availableOps[0];
      return;
    }
    if (availableOps.length === 0) return;

    if (availableOps.includes(opSelect.value)) return;

    const swapped = swapCaseKeyForOp(currentCaseKey, opSelect.value);
    if (swapped && caseSelect.querySelector(`option[value="${swapped}"]`)) {
      caseSelect.value = swapped;
      return;
    }

    opSelect.value = availableOps[0];
  }

  function rebuildCaseOptions(preferredCaseKey = '') {
    const selectedOp = opSelect.value;
    const rw = rwSelect.value;
    const bs = bsSelect.value;
    const qd = qdSelect.value;
    const rt = runtimeSelect.value;
    const direct = directSelect.value;
    const fd = fdatasyncSelect.value;
    const engine = ioengineSelect.value;
    const mix = mixSelect.value;
    const sp = sizePolicySelect.value;

    const entries = Object.entries(caseDefs)
      .filter(([caseKey, sig]) =>
        matchesFilter(sig, 'rw', rw) &&
        matchesFilter(sig, 'bs', bs) &&
        matchesFilter(sig, 'qd', qd) &&
        matchesFilter(sig, 'runtime_s', rt) &&
        matchesFilter(sig, 'direct', direct) &&
        matchesFilter(sig, 'fdatasync', fd) &&
        matchesFilter(sig, 'ioengine', engine) &&
        matchesFilter(sig, 'rwmixread', mix) &&
        (sp ? String(sig.size_policy?.mode || '') === String(sp) : true) &&
        (selectedOp ? (selectedOp === 'auto' ? true : (caseOps.get(caseKey)?.has(selectedOp) || false)) : true)
      )
      .map(([ck, sig]) => ({ case_key: ck, label: caseLabel(sig) }))
      .sort((a,b) => a.label.localeCompare(b.label));

    const current = caseSelect.value;
    caseSelect.innerHTML = '';
    entries.forEach(e => {
      const o = document.createElement('option');
      o.value = e.case_key;
      o.textContent = e.label;
      caseSelect.appendChild(o);
    });
    if (preferredCaseKey && [...caseSelect.options].some(o => o.value === preferredCaseKey)) {
      caseSelect.value = preferredCaseKey;
    } else if ([...caseSelect.options].some(o => o.value === current)) {
      caseSelect.value = current;
    } else if (caseSelect.options.length > 0) {
      caseSelect.value = caseSelect.options[0].value;
    }

    normalizeSelection();
  }

  [rwSelect, bsSelect, qdSelect, runtimeSelect, directSelect, fdatasyncSelect, ioengineSelect, mixSelect, sizePolicySelect].forEach(sel => {
    sel.addEventListener('change', () => {
      rebuildCaseOptions();
      rebuildCompareOptions();
      renderAll();
    });
  });
  caseSelect.addEventListener('change', () => {
    normalizeSelection();
    rebuildCompareOptions();
    renderAll();
  });
  opSelect.addEventListener('change', () => {
    const preferred = swapCaseKeyForOp(caseSelect.value, opSelect.value);
    rebuildCaseOptions(preferred);
    rebuildCompareOptions();
    renderAll();
  });
  viewSelect.addEventListener('change', () => {
    // history/compare 模式下没有 “latestOnly” 的意义，强制展示全量历史
    const latestOnly = document.getElementById('latestOnly');
    if (viewSelect.value === 'history') latestOnly.checked = false;
    if (viewSelect.value === 'compare') latestOnly.checked = false;
    // op=auto 仅用于 compare；离开 compare 时回到 read，避免普通 case 比较出现空表
    if (viewSelect.value !== 'compare' && opSelect.value === 'auto') opSelect.value = 'read';
    compareControls.style.display = (viewSelect.value === 'compare') ? 'block' : 'none';
    rebuildCompareOptions();
    renderAll();
  });
  systemSelect.addEventListener('change', renderAll);
  document.getElementById('metricSelect').addEventListener('change', renderAll);
  document.getElementById('latestOnly').addEventListener('change', renderAll);

  [compareGroupBy, compareSystems, compareCases, compareMetrics].forEach(sel => {
    sel.addEventListener('change', renderAll);
  });

  rebuildCaseOptions();
  rebuildCompareOptions();

  return { caseDefs, measurements, caseOps };
}

let runsDoc = null;
let runsView = null;

function buildRunsRows() {
  const op = document.getElementById('opSelect').value;
  const caseKey = document.getElementById('caseSelect').value;
  const latestOnly = document.getElementById('latestOnly').checked;
  const view = document.getElementById('viewSelect').value;
  const systemFilter = document.getElementById('systemSelect').value;

  if (!caseKey) return [];

  const selectedOp = op;
  const opsWanted = (selectedOp === 'auto') ? ['read', 'write'] : [selectedOp];

  const rows = runsView.measurements
    .filter(m => m.case_key === caseKey && opsWanted.includes(m.op))
    .filter(m => !systemFilter || m.system === systemFilter)
    .map(m => ({
      system: m.system,
      timestamp: m.timestamp,
      run_id: m.run_id,
      op: m.op,
      iops: m.iops,
      bw_mib_s: m.bw_mib_s,
      clat_p95_ms: m.clat_p95_ms,
      clat_p99_ms: m.clat_p99_ms
    }));

  // history/time 模式必须保留历史 run
  if (view === 'history') return rows;
  if (!latestOnly) return rows;

  // auto: latest per system+op
  const best = new Map();
  rows.forEach(r => {
    const key = `${r.system}|${r.op}`;
    const prev = best.get(key);
    if (!prev || (r.timestamp > prev.timestamp) || (r.timestamp === prev.timestamp && r.run_id > prev.run_id)) {
      best.set(key, r);
    }
  });
  return Array.from(best.values());
}

function pickLatestBySystemCaseOp(measurements, systems, caseOpsWanted) {
  const best = new Map();
  const sysSet = new Set(systems);
  const caseOpSet = new Set(caseOpsWanted.map(x => `${x.case_key}|${x.op}`));
  measurements.forEach(m => {
    if (!sysSet.has(m.system)) return;
    const key2 = `${m.case_key}|${m.op}`;
    if (!caseOpSet.has(key2)) return;
    const key = `${m.system}|${m.case_key}|${m.op}`;
    const prev = best.get(key);
    if (!prev || (m.timestamp > prev.timestamp) || (m.timestamp === prev.timestamp && m.run_id > prev.run_id)) {
      best.set(key, m);
    }
  });
  return best;
}

function buildCompareModel() {
  const groupBy = document.getElementById('compareGroupBy').value;
  const systemsSel = document.getElementById('compareSystems');
  const casesSel = document.getElementById('compareCases');
  const metricsSel = document.getElementById('compareMetrics');

  const systems = getSelectedValues(systemsSel);
  const caseKeys = getSelectedValues(casesSel);
  const metrics = getSelectedValues(metricsSel);

  const opMode = document.getElementById('opSelect').value;

  const caseOpsWanted = [];
  caseKeys.forEach(ck => {
    const ops = Array.from(runsView.caseOps.get(ck) || []);
    if (ops.length === 0) return;
    const include = (want) => ops.includes(want) && caseOpsWanted.push({ case_key: ck, op: want });

    if (opMode === 'read') include('read');
    else if (opMode === 'write') include('write');
    else {
      // auto behavior: single-op cases use that op; mixed cases include both
      if (ops.length === 1) include(ops[0]);
      else {
        include('read');
        include('write');
      }
    }
  });

  const systemsFinal = systems.length ? systems : Array.from(new Set(runsView.measurements.map(m => m.system))).sort((a,b)=>a.localeCompare(b,'zh-Hans'));
  const metricsFinal = metrics.length ? metrics : ['bw_mib_s'];

  const latest = pickLatestBySystemCaseOp(runsView.measurements, systemsFinal, caseOpsWanted);

  const caseOpLabels = caseOpsWanted.map(x => {
    const sig = runsView.caseDefs[x.case_key] || {};
    const base = caseLabel(sig);
    const ops = Array.from(runsView.caseOps.get(x.case_key) || []);
    const suffix = ops.length > 1 ? ` | ${x.op}` : '';
    return { ...x, label: base + suffix };
  });

  return { groupBy, systems: systemsFinal, caseOpsWanted: caseOpLabels, metrics: metricsFinal, latest };
}

function renderCompare() {
  const model = buildCompareModel();
  // Hide chart for now in compare mode (tables are the primary presentation)
  bwCanvas.style.height = '80px';
  if (bwChart) {
    bwChart.data.labels = [];
    bwChart.data.datasets.forEach(ds => ds.data = []);
    bwChart.update();
  }

  const groupBy = model.groupBy;

  // Compare uses its own table rendering; disable table header sort.
  clearHeadersAndSort();

  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  tbody.innerHTML = '';

  if (groupBy === 'run') {
    model.systems.forEach(system => {
      const trTitle = document.createElement('tr');
      trTitle.innerHTML = `<td colspan="999" style="text-align:left; font-weight:600; background:#f8fafc;">${esc(system)}</td>`;
      tbody.appendChild(trTitle);

      const trHead = document.createElement('tr');
      trHead.innerHTML = `<td style="text-align:left;">case</td>` + model.metrics.map(m => `<td>${esc(m)}</td>`).join('');
      tbody.appendChild(trHead);

      model.caseOpsWanted.forEach(co => {
        const m = model.latest.get(`${system}|${co.case_key}|${co.op}`);
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="text-align:left;">${esc(co.label)}</td>` + model.metrics.map(metric => {
          if (!m) return `<td>-</td>`;
          const v = m[metric];
          const txt = (metric.startsWith('clat_')) ? fmtLatencyMs(v) : (metric === 'iops' ? fmt(v,0) : fmt(v,2));
          const tip = `run_id=${m.run_id}\\n${m.timestamp}`;
          return `<td title="${esc(tip)}">${esc(txt)}</td>`;
        }).join('');
        tbody.appendChild(tr);
      });
    });
  } else {
    // group by metric
    model.metrics.forEach(metric => {
      const trTitle = document.createElement('tr');
      trTitle.innerHTML = `<td colspan="999" style="text-align:left; font-weight:600; background:#f8fafc;">metric: ${esc(metric)}</td>`;
      tbody.appendChild(trTitle);

      const trHead = document.createElement('tr');
      trHead.innerHTML = `<td style="text-align:left;">system</td>` + model.caseOpsWanted.map(co => `<td>${esc(co.label)}</td>`).join('');
      tbody.appendChild(trHead);

      model.systems.forEach(system => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td style="text-align:left;">${esc(system)}</td>` + model.caseOpsWanted.map(co => {
          const m = model.latest.get(`${system}|${co.case_key}|${co.op}`);
          if (!m) return `<td>-</td>`;
          const v = m[metric];
          const txt = (metric.startsWith('clat_')) ? fmtLatencyMs(v) : (metric === 'iops' ? fmt(v,0) : fmt(v,2));
          const tip = `run_id=${m.run_id}\\n${m.timestamp}`;
          return `<td title="${esc(tip)}">${esc(txt)}</td>`;
        }).join('');
        tbody.appendChild(tr);
      });
    });
  }

  const sysCount = model.systems.length;
  const caseCount = model.caseOpsWanted.length;
  const metricCount = model.metrics.length;
  runsHint.textContent = `compare | group_by=${groupBy} | systems=${sysCount} | cases(op)=${caseCount} | metrics=${metricCount}`;
}

function renderAll() {
  if (viewMode === 'runs' && document.getElementById('viewSelect')?.value === 'compare') {
    renderCompare();
    return;
  }

  if (viewMode === 'runs') ensureRunsHeaders();
  if (viewMode === 'legacy') ensureLegacyHeaders();

  const rows = (viewMode === 'legacy') ? data : buildRunsRows();
  const sorted = sortData(rows);
  renderTable(sorted);
  renderChart(sorted);
  updateHeaderIndicators();

  if (viewMode === 'runs') {
    const op = document.getElementById('opSelect').value;
    const caseKey = document.getElementById('caseSelect').value;
    const sig = runsView.caseDefs[caseKey];
    const view = document.getElementById('viewSelect').value;
    const sys = document.getElementById('systemSelect').value;
    runsHint.textContent = sig ? `case_key=${caseKey} | ${caseLabel(sig)} | matched systems=${sorted.length}` : `case_key=${caseKey} | matched systems=${sorted.length}`;
    if (view === 'history') {
      runsHint.textContent = (sig ? `case_key=${caseKey} | ${caseLabel(sig)}` : `case_key=${caseKey}`) + (sys ? ` | system=${sys}` : '') + ` | runs=${sorted.length}`;
    }
  }
}

tbody.addEventListener('click', async (e) => {
  const a = e.target.closest('a[data-runid]');
  if (!a) return;
  e.preventDefault();
  if (viewMode !== 'runs') return;

  const runId = a.dataset.runid;
  try {
    const res = await fetch(`results/runs/${runId}.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`failed to load run: ${res.status}`);
    const doc = await res.json();
    const run = doc.run || {};
    runDetailsTitle.textContent = `${run.system || '(unknown)'} | ${run.timestamp || ''} | ${runId}`;
    runDetailsMeta.textContent = `engine=${run.engine || '-'} | profile=${run.invoked_profile || '-'} | target_dir=${run.target_dir || '-'}`;

    const rows = [];
    (doc.cases || []).forEach(c => {
      const label = caseLabel(c.case || {});
      const ops = c.ops || {};
      ['read','write'].forEach(op => {
        if (!ops[op]) return;
        rows.push({ case: label, op, ...ops[op] });
      });
    });

    runDetailsTbody.innerHTML = '';
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align:left;">${r.case}</td>
        <td>${r.op}</td>
        <td>${fmt(r.iops,0)}</td>
        <td>${fmt(r.bw_mib_s,2)}</td>
        <td>${fmtLatencyMs(r.clat_p95_ms)}</td>
        <td>${fmtLatencyMs(r.clat_p99_ms)}</td>`;
      runDetailsTbody.appendChild(tr);
    });

    runDetails.style.display = 'block';
  } catch (err) {
    console.error(err);
  }
});

(async () => {
  try {
    const doc = await loadData();
    if (doc && Array.isArray(doc.measurements) && doc.measurements.length > 0) {
      viewMode = 'runs';
      runsDoc = doc;
      runsControls.style.display = 'block';
      sortKey = 'bw_mib_s';
      sortDir = 'desc';
      setHeaders([
        { key: 'system', label: 'system' },
        { key: 'timestamp', label: 'timestamp' },
        { key: 'op', label: 'op' },
        { key: 'iops', label: 'iops' },
        { key: 'bw_mib_s', label: 'bw_mib_s' },
        { key: 'clat_p95_ms', label: 'clat_p95_ms' },
        { key: 'clat_p99_ms', label: 'clat_p99_ms' }
      ]);
      bindSortHandlers();
      runsView = buildRunsView(doc);
      data = [];
    } else {
      viewMode = 'legacy';
      runsControls.style.display = 'none';
      sortKey = 'seq_read_mib_s';
      sortDir = 'asc';
      setHeaders([
        { key: 'device', label: '设备' },
        { key: 'rand_read_iops', label: '随机读 IOPS' },
        { key: 'rand_read_bw_mib', label: '随机读 MiB/s' },
        { key: 'rand_write_iops', label: '随机写 IOPS' },
        { key: 'rand_write_bw_mib', label: '随机写 MiB/s' },
        { key: 'seq_read_mib_s', label: '顺序读 MiB/s' },
        { key: 'seq_write_mib_s', label: '顺序写 MiB/s' }
      ]);
      bindSortHandlers();
      data = Array.isArray(doc?.legacy_rows) ? doc.legacy_rows : [];
    }
  } catch (err) {
    console.error(err);
    viewMode = 'legacy';
    runsControls.style.display = 'none';
    setHeaders([
      { key: 'device', label: '设备' },
      { key: 'rand_read_iops', label: '随机读 IOPS' },
      { key: 'rand_read_bw_mib', label: '随机读 MiB/s' },
      { key: 'rand_write_iops', label: '随机写 IOPS' },
      { key: 'rand_write_bw_mib', label: '随机写 MiB/s' },
      { key: 'seq_read_mib_s', label: '顺序读 MiB/s' },
      { key: 'seq_write_mib_s', label: '顺序写 MiB/s' }
    ]);
    bindSortHandlers();
    data = [];
  }
  renderAll();
})();
</script>
