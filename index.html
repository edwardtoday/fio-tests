Chart.register(ChartDataLabels);

function fmt(val, digits=1) {
  return (val === null || val === undefined) ? '-' : Number(val).toFixed(digits);
}

// 排序状态（默认顺序读 MiB/s 升序）
let sortKey = 'seq_read_mib_s';
let sortDir = 'asc';
const headerCells = Array.from(document.querySelectorAll('#results thead th[data-key]'));
const tbody = document.querySelector('#results tbody');

function sortData(rows) {
  return [...rows].sort((a, b) => {
    const va = a[sortKey];
    const vb = b[sortKey];
    const na = va === null || va === undefined;
    const nb = vb === null || vb === undefined;
    if (na && nb) return 0;
    if (na) return 1;
    if (nb) return -1;
    const bothNumbers = typeof va === 'number' && typeof vb === 'number';
    if (bothNumbers) return sortDir === 'asc' ? va - vb : vb - va;
    const cmp = String(va).localeCompare(String(vb), 'zh-Hans');
    return sortDir === 'asc' ? cmp : -cmp;
  });
}

function renderTable(sorted) {
  tbody.innerHTML = '';
  sorted.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.device}</td>
      <td>${fmt(d.rand_read_iops,0)}</td>
      <td>${fmt(d.rand_read_bw_mib,2)}</td>
      <td>${fmt(d.rand_write_iops,0)}</td>
      <td>${fmt(d.rand_write_bw_mib,2)}</td>
      <td>${fmt(d.seq_read_mib_s,1)}</td>
      <td>${fmt(d.seq_write_mib_s,1)}</td>`;
    tbody.appendChild(tr);
  });
}

function updateHeaderIndicators() {
  headerCells.forEach(th => {
    const base = th.dataset.label || th.textContent.replace(/ [↑↓]$/, '');
    th.dataset.label = base;
    if (th.dataset.key === sortKey) {
      th.textContent = `${base} ${sortDir === 'asc' ? '↑' : '↓'}`;
    } else {
      th.textContent = base;
    }
  });
}

const bwCanvas = document.getElementById('bwAll');
const BW_DATASET_COUNT = 4;
const BW_BAR_THICKNESS = 12; // 提高每组柱子的厚度，避免 data label 纵向挤在一起

// 横向分组柱状：每个设备四根柱子展示吞吐（MiB/s）

    datasets: [

    ]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom' },
      datalabels: {
        color: '#111827',
        anchor: 'end',
        align: 'end',
        offset: 4,
        clip: false,
        font: { size: 10 },
        formatter: (v) => (v == null ? '' : v.toFixed(1))
      }
    },
    scales: {
      x: { beginAtZero: true },
      y: { ticks: { autoSkip: false, maxRotation: 0, minRotation: 0 } }
    }
  }
});

function renderChart(sorted) {
  // 按设备数量动态拉高画布，避免 data label 纵向重叠
  const perDevice = BW_BAR_THICKNESS * BW_DATASET_COUNT + 18;
  const height = 180 + sorted.length * perDevice;
  bwCanvas.style.height = `${height}px`;

  bwChart.data.labels = sorted.map(d => d.device);
  bwChart.data.datasets[0].data = sorted.map(d => d.rand_read_bw_mib);
  bwChart.data.datasets[1].data = sorted.map(d => d.rand_write_bw_mib);
  bwChart.data.datasets[2].data = sorted.map(d => d.seq_read_mib_s);
  bwChart.data.datasets[3].data = sorted.map(d => d.seq_write_mib_s);
  bwChart.update();
}

function renderAll() {
  const sorted = sortData(data);
  renderTable(sorted);
  renderChart(sorted);
  updateHeaderIndicators();
}

headerCells.forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = 'asc';
    }
    renderAll();
  });
});
