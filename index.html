<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fio 测试汇总</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 24px; color: #1f2933; }
    h1 { margin-bottom: 8px; }
    .subtitle { color: #52606d; margin-bottom: 24px; }
    table { border-collapse: collapse; width: 100%; margin: 24px 0; font-size: 14px; }
    th, td { border: 1px solid #d9e2ec; padding: 8px 10px; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #f0f4f8; cursor: pointer; user-select: none; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    canvas { background: #fff; border: 1px solid #e4e7eb; padding: 12px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  </style>
</head>
<body>
  <h1>fio 测试汇总</h1>
  <div class="subtitle">随机读写展示 IOPS 与 MiB/s，顺序读写展示吞吐 (MiB/s)。数据来自仓库中的 fio 测试日志。</div>

  <table id="results">
    <thead>
      <tr>
        <th data-key="device">设备</th>
        <th data-key="rand_read_iops">随机读 IOPS</th>
        <th data-key="rand_read_bw_mib">随机读 MiB/s</th>
        <th data-key="rand_write_iops">随机写 IOPS</th>
        <th data-key="rand_write_bw_mib">随机写 MiB/s</th>
        <th data-key="seq_read_mib_s">顺序读 MiB/s</th>
        <th data-key="seq_write_mib_s">顺序写 MiB/s</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="charts">
    <canvas id="bwAll"></canvas>
  </div>

<script>
let data = [];

async function loadData() {
  const res = await fetch('results/data.json', { cache: 'no-store' });
  if (!res.ok) throw new Error(`failed to load results/data.json: ${res.status}`);
  const doc = await res.json();
  if (Array.isArray(doc?.legacy_rows)) return doc.legacy_rows;
  if (Array.isArray(doc)) return doc;
  return [];
}

Chart.register(ChartDataLabels);

function fmt(val, digits=1) {
  return (val === null || val === undefined) ? '-' : Number(val).toFixed(digits);
}

// 排序状态（默认顺序读 MiB/s 升序）
let sortKey = 'seq_read_mib_s';
let sortDir = 'asc';
const headerCells = Array.from(document.querySelectorAll('#results thead th[data-key]'));
const tbody = document.querySelector('#results tbody');

function sortData(rows) {
  return [...rows].sort((a, b) => {
    const va = a[sortKey];
    const vb = b[sortKey];
    const na = va === null || va === undefined;
    const nb = vb === null || vb === undefined;
    if (na && nb) return 0;
    if (na) return 1;
    if (nb) return -1;
    const bothNumbers = typeof va === 'number' && typeof vb === 'number';
    if (bothNumbers) return sortDir === 'asc' ? va - vb : vb - va;
    const cmp = String(va).localeCompare(String(vb), 'zh-Hans');
    return sortDir === 'asc' ? cmp : -cmp;
  });
}

function renderTable(sorted) {
  tbody.innerHTML = '';
  sorted.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${d.device}</td>
      <td>${fmt(d.rand_read_iops,0)}</td>
      <td>${fmt(d.rand_read_bw_mib,2)}</td>
      <td>${fmt(d.rand_write_iops,0)}</td>
      <td>${fmt(d.rand_write_bw_mib,2)}</td>
      <td>${fmt(d.seq_read_mib_s,1)}</td>
      <td>${fmt(d.seq_write_mib_s,1)}</td>`;
    tbody.appendChild(tr);
  });
}

function updateHeaderIndicators() {
  headerCells.forEach(th => {
    const base = th.dataset.label || th.textContent.replace(/ [↑↓]$/, '');
    th.dataset.label = base;
    if (th.dataset.key === sortKey) {
      th.textContent = `${base} ${sortDir === 'asc' ? '↑' : '↓'}`;
    } else {
      th.textContent = base;
    }
  });
}

const bwCanvas = document.getElementById('bwAll');
const BW_DATASET_COUNT = 4;
const BW_BAR_THICKNESS = 12; // 提高每组柱子的厚度，避免 data label 纵向挤在一起

// 横向分组柱状：每个设备四根柱子展示吞吐（MiB/s）
const bwChart = new Chart(bwCanvas.getContext('2d'), {
  type: 'bar',
  data: {
    labels: [],
    datasets: [
      { label: '随机读 MiB/s', backgroundColor: '#7c3aed', data: [], barThickness: BW_BAR_THICKNESS, maxBarThickness: BW_BAR_THICKNESS },
      { label: '随机写 MiB/s', backgroundColor: '#f97316', data: [], barThickness: BW_BAR_THICKNESS, maxBarThickness: BW_BAR_THICKNESS },
      { label: '顺序读 MiB/s', backgroundColor: '#0ea5e9', data: [], barThickness: BW_BAR_THICKNESS, maxBarThickness: BW_BAR_THICKNESS },
      { label: '顺序写 MiB/s', backgroundColor: '#e11d48', data: [], barThickness: BW_BAR_THICKNESS, maxBarThickness: BW_BAR_THICKNESS }
    ]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom' },
      datalabels: {
        color: '#111827',
        anchor: 'end',
        align: 'end',
        offset: 4,
        clip: false,
        font: { size: 10 },
        formatter: (v) => (v == null ? '' : v.toFixed(1))
      }
    },
    scales: {
      x: { beginAtZero: true },
      y: { ticks: { autoSkip: false, maxRotation: 0, minRotation: 0 } }
    }
  }
});

function renderChart(sorted) {
  // 按设备数量动态拉高画布，避免 data label 纵向重叠
  const perDevice = BW_BAR_THICKNESS * BW_DATASET_COUNT + 18;
  const height = 180 + sorted.length * perDevice;
  bwCanvas.style.height = `${height}px`;

  bwChart.data.labels = sorted.map(d => d.device);
  bwChart.data.datasets[0].data = sorted.map(d => d.rand_read_bw_mib);
  bwChart.data.datasets[1].data = sorted.map(d => d.rand_write_bw_mib);
  bwChart.data.datasets[2].data = sorted.map(d => d.seq_read_mib_s);
  bwChart.data.datasets[3].data = sorted.map(d => d.seq_write_mib_s);
  bwChart.update();
}

function renderAll() {
  const sorted = sortData(data);
  renderTable(sorted);
  renderChart(sorted);
  updateHeaderIndicators();
}

headerCells.forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = 'asc';
    }
    renderAll();
  });
});

(async () => {
  try {
    data = await loadData();
  } catch (err) {
    console.error(err);
    data = [];
  }
  renderAll();
})();
</script>
</body>
</html>
